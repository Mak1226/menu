<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="Fast, mobile-friendly mess menu viewer."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Mess Menu</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SEDC MESS</p>
          <h1>Mess Menu</h1>
        </div>
        <button
          id="installBtn"
          class="icon-btn hidden"
          aria-label="Install app"
        >
          Install
        </button>
      </header>

      <main>
        <section id="hero" class="hero"></section>

        <section class="toolbar">
          <div class="tabs" role="tablist">
            <button class="tab active" data-view="today">Today</button>
            <button class="tab" data-view="tomorrow">Tomorrow</button>
            <button class="tab" data-view="week">All Dates</button>
          </div>

          <label class="date-wrap">
            <span>Date</span>
            <select id="dateSelect" aria-label="Choose date"></select>
          </label>
        </section>

        <section id="content" class="content"></section>
      </main>

      <footer>
        <span>Asia/Kolkata time</span>
        <span>•</span>
        <span>Menu stored in your GitHub repo</span>
      </footer>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
