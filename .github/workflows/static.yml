name: Convert Excel and deploy Pages

on:
  push:
    branches: ["master"]
    paths:
      - "source/menu.xlsx"
      - "source/menu.xlsx.b64.ready"
      - "scripts/convert_menu.py"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover staged Excel source if present
        run: |
          if [ -f 'source/menu.xlsx.b64.ready' ]; then
            python3 - <<'PY'
          import base64
          import glob
          import zipfile
          from pathlib import Path

          parts = [Path(p) for p in sorted(glob.glob('source/menu.xlsx.b64.part??'))]
          if not parts:
              raise SystemExit('No staged Excel parts found')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          target = Path('source/menu.xlsx')
          target.write_bytes(raw)
          with zipfile.ZipFile(target) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'Excel archive is corrupt at {bad}')
          print(f'Restored verified Excel workbook from {len(parts)} staged parts')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add source/menu.xlsx
            git rm source/menu.xlsx.b64.part* source/menu.xlsx.b64.ready
            git commit -m 'Replace mess menu Excel source'
            git push origin HEAD:master
          fi

      - name: Convert Excel menu to JSON
        run: python3 scripts/convert_menu.py source/menu.xlsx data/menu.json

      - name: Validate generated menu
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/menu.json').read_text(encoding='utf-8'))
          if not data:
              raise SystemExit('Generated menu is empty')
          if len(data) != len({day['date'] for day in data}):
              raise SystemExit('Duplicate menu dates')
          required = {'Breakfast', 'Lunch', 'Evening Snacks', 'Dinner'}
          for day in data:
              if set(day.get('meals', {})) != required or any(not rows for rows in day['meals'].values()):
                  raise SystemExit(f"Invalid meal section for {day.get('date')}")
          print(f"Validated {len(data)} menu dates: {data[0]['date']} to {data[-1]['date']}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
