name: Convert Excel and deploy Pages

on:
  push:
    branches: ["master"]
    paths:
      - "source/menu.xlsx"
      - "scripts/convert_menu.py"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert Excel menu to JSON
        run: python3 scripts/convert_menu.py source/menu.xlsx data/menu.json

      - name: Validate generated menu
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/menu.json').read_text())
          if not data:
              raise SystemExit('Generated menu is empty')
          required = {'Breakfast', 'Lunch', 'Evening Snacks', 'Dinner'}
          for day in data:
              if set(day.get('meals', {})) != required:
                  raise SystemExit(f"Missing meal section for {day.get('date')}")
          print(f"Validated {len(data)} menu dates")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# Touch: force deploy after repairing source/menu.xlsx
